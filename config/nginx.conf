server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Redirect otomatis HTTP ke HTTPS
    return 301 https://$host$request_uri;
}

server {
    # Port TCP untuk HTTPS (HTTP/1.1 & HTTP/2)
    listen 443 ssl;
    listen [::]:443 ssl;

    # Port UDP untuk QUIC / HTTP/3
    listen 443 quic reuseport;
    listen [::]:443 quic;

    server_name localhost;

    # Wajib aktifkan HTTP/2 dan HTTP/3 di NGINX
    http2 on;
    http3 on;

    # Optimasi UDP Buffer Performance di Linux
    quic_gso on;

    # Path Sertifikat SSL (Disesuaikan dengan file mkcert / mount Docker)
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Protokol SSL Wajib TLS 1.3 untuk HTTP/3
    ssl_protocols TLSv1.2 TLSv1.3;

    # Header Alt-Svc memberitahu browser bahwa HTTP/3 tersedia di port 443
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    location / {
        proxy_pass http://app:3000;

        # Header Standar Reverse Proxy & WebSocket Support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
