server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    return 301 https://$host$request_uri;
}

server {
    # Port TCP untuk HTTPS (HTTP/1.1 & HTTP/2)
    listen 443 ssl;
    listen [::]:443 ssl;

    # Port UDP untuk QUIC / HTTP/3
    listen 443 quic reuseport;
    listen [::]:443 quic; # Hapus 'reuseport' di sini

    server_name localhost;

    # Aktifkan HTTP/2 dan HTTP/3 secara eksplisit
    http2 on;
    http3 on;

    # Path Sertifikat SSL
ssl_certificate     /etc/angie/ssl/fullchain.pem;
ssl_certificate_key /etc/angie/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    # Memberitahu browser untuk switch ke HTTP/3
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    location / {
        proxy_pass http://app:3000;

        # Konfigurasi Proxy & WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
