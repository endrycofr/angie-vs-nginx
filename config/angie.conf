include prometheus_all.conf;

# ==============================================================================
# 2. Server Redirect HTTP ke HTTPS
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    status_zone http_redirect;

    return 301 https://$host$request_uri;
}

# ==============================================================================
# 3. Server Utama (Node.js + SSL + HTTP/3 QUIC)
# ==============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    listen 443 quic reuseport;
    listen [::]:443 quic;

    server_name localhost;

    # PENTING: Nama zone wajib didaftarkan di sini
    status_zone main_https;

    http2 on;
    http3 on;

    ssl_certificate     /etc/angie/ssl/fullchain.pem;
    ssl_certificate_key /etc/angie/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    location / {
        proxy_pass http://app:3000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ==============================================================================
# 4. Server Monitoring & Metrics (Port 8080)
# ==============================================================================
server {
    listen 8080;
    listen [::]:8080;
    server_name localhost;

    location /metrics {
        prometheus all;
    }
}
